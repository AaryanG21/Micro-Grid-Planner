services:
  # Flask Backend Web Service
  - type: web
    name: microgrid-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: microgrid-db
          property: connectionString

  # React Frontend Static Site
  - type: web
    name: microgrid-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: microgrid-db
    databaseName: microgrid
    user: microgrid_user

